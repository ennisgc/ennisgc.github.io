</div>
<div class="row g-4 align-items-center">
<h3 class="mt-4">Backing Tracks</h3>

<div class="row g-3 my-3">

        <div class="ratio ratio-16x9">

        </div>

    </div>

      </div>
          <offcanvas class="offcanvas offcanvas-end" id="lyricsOffcanvas" tabindex="-1" aria-labelledby="offcanvasLabel" style="width: 90%">

      <h3>Lyrics</h3>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>

            </div><br>
            <pre class="bg-light p-3 rounded">
Lyrics
    </pre>
          </div><br>
          <div class="offcanvas-footer" style="display: flex; justify-content: center;">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Close</button>
          </div><br>
    </offcanvas>
